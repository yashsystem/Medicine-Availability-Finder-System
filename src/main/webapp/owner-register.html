<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Owner Registration</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            padding: 25px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #174a8b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            margin-top: 22px;
            background: #1769aa;
            color: white;
            border: none;
            cursor: pointer;
        }

        .note {
            font-size: 13px;
            color: #555;
        }
    </style>
</head>

<body>
<div class="container">
    <h2>Pharmacy Owner Registration</h2>

    <form action="owner-register" method="post">
        <label for="ownerName">Owner Name</label>
        <input type="text" id="ownerName" name="ownerName"
               maxlength="100" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               maxlength="150" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               minlength="8" maxlength="72" required>

        <p class="note">
            Use at least 8 characters. Passwords are securely hashed before storage.
        </p>

        <label for="pharmacyId">Select Pharmacy</label>
        <select id="pharmacyId" name="pharmacyId" required>
            <option value="">Choose your pharmacy</option>
            <option value="1">City Medical Store</option>
            <option value="2">Health Care Pharmacy</option>
        </select>

        <button type="submit">Register</button>
    </form>

    <p class="note">
        Demo project: the pharmacy options are currently predefined.
    </p>

    <p><a href="index.html">Back to Home</a></p>
</div>
</body>
</html>
