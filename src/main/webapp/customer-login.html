<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 400px;
            margin: 50px auto;
            padding: 25px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #087f5b;
        }

        label {
            display: block;
            margin-top: 18px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            width: 100%;
            margin-top: 22px;
            padding: 12px;
            background: #087f5b;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #066847;
        }

        p {
            text-align: center;
            margin-top: 18px;
        }

        a {
            color: #087f5b;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Customer Login</h2>

        <form action="customer-login" method="post">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   maxlength="150" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                   required>

            <button type="submit">Login</button>
        </form>

        <p>New customer?
            <a href="customer-register.html">Create an Account</a>
        </p>

        <p><a href="index.html">Back to Medicine Search</a></p>
    </div>
</body>
</html>
