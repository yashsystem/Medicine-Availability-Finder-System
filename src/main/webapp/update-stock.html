<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Medicine Stock</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f6fc;
            padding: 30px 15px;
        }

        .container {
            max-width: 450px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ccc;
        }

        h2 {
            text-align: center;
            color: #174a8b;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, button {
            width: 100%;
            box-sizing: border-box;
            padding: 11px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            background: #1769aa;
            color: white;
            border: none;
            margin-top: 22px;
            cursor: pointer;
        }

        button:hover {
            background: #104b7c;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>
<div class="container">

    <h2>Update Medicine Stock</h2>

    <form action="update-stock" method="post">

        <label for="medicineId">Medicine ID</label>
        <input type="number" id="medicineId"
               name="medicineId" min="1" required>

        <label for="quantity">New Available Quantity</label>
        <input type="number" id="quantity"
               name="quantity" min="0" required>

        <label for="price">New Price (₹)</label>
        <input type="number" id="price"
               name="price" min="0" step="0.01" required>

        <button type="submit">Update Stock</button>

    </form>

    <a href="index.html">Back to Home</a>

</div>
</body>
</html>
